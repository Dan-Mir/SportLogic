services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportlogic
      POSTGRES_PASSWORD: sportlogic
      POSTGRES_DB: sportlogic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportlogic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      SPORTLOGIC_DATABASE_URL: postgresql+psycopg://sportlogic:sportlogic@db:5432/sportlogic
      SPORTLOGIC_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sportlogic-worker"]
    env_file:
      - .env
    environment:
      SPORTLOGIC_DATABASE_URL: postgresql+psycopg://sportlogic:sportlogic@db:5432/sportlogic
      SPORTLOGIC_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      SPORTLOGIC_PUBLIC_DOMAIN: ${SPORTLOGIC_PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
